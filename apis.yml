name: EXIGER
description: >-
  Exiger is an AI-native supply chain, third-party, and software supply chain risk
  and compliance company. Its 1Exiger platform unifies supplier, product, part,
  component, and risk data into a single system to help organizations map and
  orchestrate compliant, resilient physical and software supply chains. Product
  areas span supply chain visibility and optimization, trade and third-party risk
  and compliance, due diligence intelligence (DDIQ), and software supply chain
  security (SBOM analysis, from its Ion Channel acquisition). Exiger serves
  government and commercial customers and is FedRAMP authorized. This profile was
  surfaced as an Insight Partners portfolio company and enriched from Exiger's
  public corporate, trust, and legal surfaces; Exiger does not publish a public
  developer portal, API reference, or client SDKs.
